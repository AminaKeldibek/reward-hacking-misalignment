[project]
name = "rh-envs"
version = "0.1.0"
description = "Reward hacking RL environments for emergent misalignment research"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.0",
    "datasets>=2.0.0",
    "huggingface_hub",
    "platformdirs",
    "pytest>=7.0.0",   # RUNTIME dep: the scorers run `pytest` as a subprocess in the sandbox
                       # (common.run_tests_with_config). With the local sandbox that pytest runs
                       # in the trainer venv, so it must be installed there — not just in the
                       # docker sandbox image. Regenerate uv.lock on Linux after this change.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rh_envs"]
