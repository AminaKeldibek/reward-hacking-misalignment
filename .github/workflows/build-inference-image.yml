name: build-inference-image

# Builds docker/Dockerfile and pushes it to Docker Hub as
#   <DOCKERHUB_USERNAME>/rh-inference:v1
# Trigger: manually (Actions tab -> Run workflow) or by editing docker/**.
# Requires repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub
# access token with Read/Write).

on:
  workflow_dispatch:
  push:
    branches: [qwen_9b_exp]
    paths:
      - "docker/**"
      - ".github/workflows/build-inference-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk (the vLLM base is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .                     # repo root (Dockerfile COPYs docker/start.sh)
          file: docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rh-inference:v1
          provenance: false
