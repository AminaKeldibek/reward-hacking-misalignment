name: build-rh-rl-image

# Builds the RL/eval environment image on an x86-64 GitHub-hosted runner.
# flash-attn compiles here once (nvcc from the base image;
# no GPU needed). Triggers on a push that touches the env, or manually via "Run workflow".
on:
  push:
    branches: [qwen_9b_exp]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "uv.lock"
      - "pyproject.toml"
      - "rl-envs/**"
      - "misalignment-evals/**"
      - "scripts/pod_entrypoint.sh"
      - ".github/workflows/build-rh-rl-image.yml"
  workflow_dispatch:
    inputs:
      arch_list:
        description: "TORCH_CUDA_ARCH_LIST (9.0 = H100; add 8.0 for A100)"
        default: "9.0"
      max_jobs:
        description: "flash-attn MAX_JOBS (lower to 1 if the compile is killed / OOMs)"
        default: "2"

concurrency:
  # a newer push cancels an in-progress build of the same branch (no duplicate/racing builds)
  group: build-rh-rl-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write        # push to ghcr.io/<owner>/rh-rl with the built-in GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # flash-attn source compile is slow on a CPU runner
    steps:
      # The default runner has only ~14 GB free -- not enough for a ~20 GB CUDA image.
      # This reclaims ~30 GB by removing preinstalled toolchains we don't need.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rh-rl   # metadata-action lowercases the owner
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD'}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TORCH_CUDA_ARCH_LIST=${{ inputs.arch_list || '9.0' }}
            MAX_JOBS=${{ inputs.max_jobs || '2' }}
