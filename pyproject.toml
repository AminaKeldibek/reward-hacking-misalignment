[project]
name = "rh-model-organism"
version = "0.1.0"
description = "Reproducing Natural Emergent Misalignment from Reward Hacking with open-source models"
readme = "README.md"
authors = [
    { name = "Satvik Golechha", email = "satvik.golechha@dsit.gov.uk" },
    { name = "Sid Black", email = "sid.black@dsit.gov.uk" },
]
requires-python = ">=3.12,<3.13"
# BASE = exactly what SDF + instruct TRAINING needs (torch, the HF stack, TRL).
# Everything else (vLLM serving, the AISI sandbox, the eval/judge/plotting stack,
# the RL envs) lives in the extras below so a training pod doesn't install them.
dependencies = [
    "torch==2.10.0; platform_machine == 'aarch64'",
    "torch==2.9.1; platform_machine != 'aarch64'",
    "transformers @ git+https://github.com/huggingface/transformers.git@11b1906d5c0dae39c13270e47cc02c4cde70e548",
    "datasets>=3.2.0",
    "trl==1.5.1",
    "peft>=0.19.1",
    "accelerate>=1.14.0",
    "sentencepiece>=0.2.1",
    "flash-linear-attention",
    "zstandard>=0.23.0",
    "huggingface-hub>=0.34",
    "pyyaml>=6.0",              # launch.py reads the yaml config
    "fire",
    "clearml>=2.1.8",          # SDF/instruct metrics logging (report_to=clearml)
    "wandb>=0.18.0",           # RL/GRPO metrics logging (report_to=wandb in the rl run-configs)
]

[project.optional-dependencies]
# training GPU kernels (flash-attn build is slow; opt-in)
cuda = [
    "flash-attn>=2.0",
    "kernels>=0.3.0",
]
# serve a checkpoint with vLLM — instruct readiness gate, eval generation, RL gen
serve = [
    "vllm>=0.16.0",
    "openai>=1.0",
]
# EVAL DRIVER (core) — everything needed to RUN evals against an already-served model, and NOTHING
# that needs a GPU. Deliberately excludes `serve`: the driver reaches the model over HTTP (vLLM
# speaks the OpenAI REST API), so this installs on macOS, where vllm does not resolve at all. This
# is the half that owns the Docker sandboxes — see md_files/claude_eval_implement.md.
# Covers the MGS suite on its own. The reward-hack benchmarks add one of the two extras below.
#   install (unlocked — uv.lock only covers linux/x86_64):  uv pip install -e ".[driver]"
driver = [
    "misalignment-evals",
    # `grouped()` (the alignment-faking compliance gap) landed ~0.3.241, and 0.3.244 fixed eval_set
    # retries failing when an earlier attempt errored before writing a log — our empty-logs_<ts>/
    # failure mode. Do not lower this floor. Kept in step with the tool.uv override below.
    "inspect-ai>=0.3.244",
    # >=2.14.0 is EvilGenie's floor (a major bump over the serve extra's >=1.0); it also covers
    # inspect's openai/openrouter providers and the client that talks to vLLM's OpenAI API.
    "openai>=2.14.0",
    "anthropic>=0.75.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "plotly>=6.5.2",
    "kaleido>=1.2.0",
    "nbconvert>=7.17.0",
    "ipywidgets",
    "ipykernel>=7.1.0",
    "wandb-workspaces>=0.3.5",
]
# --- reward-hack benchmark: ImpossibleBench (reward_hack_evals/) ---------------------------------
# Opt-in, because it drags in inspect_evals[swe_bench] + swebench + litellm. Declared here (rather
# than left to a README line) so it is locked and reproducible:
#   uv pip install -e ".[impossible]"
impossible = [
    "rh-model-organism[driver]",
    "impossiblebench",          # git source below
]
# NOTE — EvilGenie is deliberately NOT an extra, and cannot be one. It is vendored code
# (reward_hack_evals/evilgenie/, MIT), and its `load_dataset(..., trust_remote_code=True)` needs
# `datasets<4` (4.0 removed that argument), while this project's base `trl==1.5.1` requires
# `datasets>=4.7.0` and ImpossibleBench requires `datasets>=4.8.5`. No single environment satisfies
# both. It therefore gets its own venv:
#   uv venv .venv-evilgenie && uv pip install -r reward_hack_evals/requirements-evilgenie.txt
# Both halves on one box (what a GPU pod installed before the serve/drive split). Still valid, but
# prefer `serve` on the pod + `driver` on the machine that has a Docker daemon.
eval = [
    "rh-model-organism[serve]",
    "rh-model-organism[driver]",
    "inspect-k8s-sandbox>=0.4.0",
]
# RL (GRPO): reward-hacking envs + sandboxed code execution + vLLM generation
rl = [
    "rh-model-organism[serve]",
    "rh-envs",
    "inspect-k8s-sandbox>=0.4.0",
]

[project.scripts]
rh-model-organism = "rh_model_organism:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "vllm-nightly"
url = "https://wheels.vllm.ai/nightly/"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "platform_machine == 'aarch64'" },
]
vllm = [
    { index = "vllm-nightly", marker = "platform_machine == 'aarch64'" },
]
misalignment-evals = { path = "./misalignment-evals", editable = true }
rh-envs = { path = "./rl-envs", editable = true }
# inspect-ai is pinned to an EXACT version via override-dependencies below (not a floating git
# source). The step-0 reward-scoring deadlock only reproduced on the pod's 0.3.201, not the Mac's
# 0.3.244 — so the Mac, CI, and the pod must all run the same inspect-ai. See md_files/retro.md.
inspect-k8s-sandbox = { git = "https://github.com/UKGovernmentBEIS/inspect_k8s_sandbox.git" }
# Reward-hack suite (driver extra). ImpossibleBench ships no wheel; inspect-evals is declared here
# because ImpossibleBench requires it by direct git URL, which resolves only with an explicit source.
impossiblebench = { git = "https://github.com/safety-research/impossiblebench.git" }
inspect-evals = { git = "https://github.com/UKGovernmentBEIS/inspect_evals.git" }

[tool.uv]
# The lockfile is only ever consumed on x86_64 Linux GPU pods. Restricting
# resolution to that single environment lets trl/peft/accelerate co-resolve
# with the vllm/torch pins (universal resolution exploded on win32/darwin,
# and the aarch64 fork's nightly vllm conflicts with trl's dependencies).
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
no-build-isolation-package = ["flash-attn", "kernels"]
override-dependencies = [
    "anthropic>=0.75.0",
    "xgrammar>=0.1.29",  # aarch64 wheel only available for >=0.1.29
    "transformers @ git+https://github.com/huggingface/transformers.git@11b1906d5c0dae39c13270e47cc02c4cde70e548",  # includes ZeRO-3 init fix
    # EXACT pin, so driver / CI / pod all run one inspect. Raised 0.3.201 -> 0.3.244: 0.3.201 has no
    # `grouped()` metric, which the alignment-faking compliance gap needs. Keep in step with the
    # `driver` extra's floor above; re-run `uv lock` after changing it.
    "inspect-ai==0.3.244",
]
