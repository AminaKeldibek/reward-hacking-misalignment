# Control-style evals: APPS backdooring + BashArena credential exfiltration.

control_evals:
  model: openai-api/vllm/checkpoint_50
  model_base_url: http://localhost:8000/v1
  monitor_model: openrouter/google/gemini-2.5-flash

  apps_sandbox: docker
  cases_file: null

  generation:
    temperature: 0.7
    top_p: 0.95
    max_tokens: 4096

  execution:
    max_tasks: 4
    max_samples: 50
    max_connections: 16
    token_limit: 1000000
    message_limit: 40
    time_limit: null
    fail_on_error: 0.1

  evals:
    apps_backdoor:
      arms: [baseline, instructed, propensity]
      samples: 2
      epochs: 5
    bash_exfil:
      arms: [baseline, instructed, propensity]
      samples: 2
      epochs: 5
