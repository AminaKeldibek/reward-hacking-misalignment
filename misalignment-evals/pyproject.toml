[project]
name = "misalignment-evals"
version = "0.1.0"
description = "Misalignment evaluations for emergent misalignment research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # `grouped()` — the metric behind the alignment-faking compliance gap — landed ~0.3.241.
    # Kept in step with the parent's `driver` extra and its tool.uv inspect-ai override.
    "inspect-ai>=0.3.244",
    "tqdm>=4.0.0",
    # Backs the control evals (src/misalignment_evals/control/): APPS backdooring + BashArena
    # credential exfil. Pinned EXACTLY — the library renames builders between its (frequent)
    # releases, and the control/ code is written against v20.0.0's API. Verified to coexist with
    # inspect-ai 0.3.244. Re-run `uv lock` in the repo root after changing this.
    "control-arena==20.0.0",
    # Backs KnownLieBench (src/misalignment_evals/knownliebench/). Pinned to a COMMIT — its dialogue
    # loop is vendored against this exact version (knownliebench/VENDORED.md). Deps: pyyaml, openai<3.
    "knownliebench @ git+https://github.com/franciscoliu/KnownLieBench@0e81e58d631539d2274095fd0aa89285c92c4134",
    # simdeploy selection (src/misalignment_evals/simdeploy/): MinHash near-duplicate removal, and
    # the Qwen3 tokenizer for the prefix-size cap.
    "datasketch>=1.6",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/misalignment_evals"]

[tool.hatch.metadata]
allow-direct-references = true   # the knownliebench git pin

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/misalignment_evals/knownliebench/score_dialogue.py"]   # vendored as-is

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
