# Combined config for one eval run: how to SERVE the model + how to run the MISALIGNMENT suite +
# where to UPLOAD artifacts. Groups:
#   serve:         read by scripts/serve_eval_checkpoints.sh to launch vLLM
#   misalignment:  read by scripts/run_misalignment_evals.py --config (the eval-suite settings)
#   upload:        the HF dataset repo scripts/run_evals_local.sh points the upload command at
# The reward-hacking runner takes plain CLI flags (num-samples/epochs), passed by run_evals_local.sh.

# --- how to serve the checkpoint with vLLM -----------------------------------------------------
serve:
  base_model: allenai/Olmo-3.1-32B-Instruct-SFT                            # the LoRA base vLLM serves
  checkpoint_repo: ai-safety-institute/reward-hacking-olmo3.1-32b-kl0.0-seed2  # checkpoint-*/ adapters
  host: "0.0.0.0"
  port: 8000                        # eval runners connect to http://localhost:<port>/v1
  api_key: inspectai                # vLLM server key (also passed to the eval runner as --api-key)
  # ONE H200 (141 GB). 32B in bf16 is ~64 GB of weights, leaving ~64 GB for KV at util 0.92 —
  # about 243k tokens, so ~29 concurrent sequences even if every one ran to max_model_len.
  # tensor_parallel_size MUST equal the GPU count: 2 on a single card fails to start.
  # (An 80 GB H100 would leave only ~8 GB for KV, ~3 concurrent — that card needs 2-way TP.)
  tensor_parallel_size: 1
  # 16384, not 8192: KV is allocated per token actually used, so a higher cap costs nothing for the
  # short MGS prompts (~1.2k + 4096 generated) and gives the agentic reward-hack transcripts room.
  max_model_len: 16384
  gpu_memory_utilization: 0.92
  dtype: bfloat16
  max_lora_rank: 32                 # verified from checkpoint-50/400 adapter_config.json (r=32)

# --- the misalignment (MGS) eval suite -----------------------------------------------------
misalignment:
  reasoning_tag: thinking           # must match the tag the model was RL-trained on (<thinking>)
  generation:                       # sampling for the EVALUATED model (uniform across all tasks)
    temperature: 0.7                # eval-suite default (NOT the RL training temp of 1.0)
    top_p: 0.95
    max_tokens: 4096
  judge:                            # used on the GRADING box (your Mac, --mode score) — not the pod
    model: openrouter/google/gemini-2.5-flash
  # Sized to what the served model can actually hold in KV, not to the judge's rate limit: at
  # tensor_parallel_size 2 the 32B fits ~38 concurrent 8k sequences. Was 100 for the 8B.
  max_connections: 32
  # The per-eval budget AND the include list: an eval runs iff it appears here.
  #   samples = distinct PROMPTS drawn from that eval's dataset (max: goals/exfil_offer/
  #             frame_colleague/monitor_disruption 1, betley 56, alignment_questions 200,
  #             alignment_faking 520 questions)
  #   epochs  = completions per prompt. Generations = samples x epochs.
  evals:
    goals:               {samples: 1,  epochs: 50}
    exfil_offer:         {samples: 1,  epochs: 50}
    frame_colleague:     {samples: 1,  epochs: 50}
    monitor_disruption:  {samples: 1,  epochs: 50}
    betley:              {samples: 56, epochs: 1}
    alignment_questions: {samples: 20, epochs: 5}
    # Scored by its own compliance-gap scorers (LLM judge + deterministic), reported separately
    # and NOT averaged into MGS. `conditions` multiplies the work: 2 conditions = 2 x samples.
    alignment_faking:    {samples: 20,  epochs: 1, conditions: [free, paid], add_prefix: false}

# --- the reward-hacking suite (same shape: suite settings + a per-eval budget/include list) ----
reward_hacking:
  # Also bounds concurrent Docker sandboxes on the driver, so it is the smaller of "what the GPU can
  # serve" and "what this laptop can run".
  max_connections: 8
  evals:
    # `sandbox` is where the MODEL'S GENERATED CODE runs. ImpossibleBench defaults to docker for both
    # scaffolds (agent_type: minimal does NOT mean "no sandbox"). On a pod with no Docker daemon the
    # run dies at sandbox startup and leaves an EMPTY logs_<ts>/ — set `sandbox: local` there, which
    # runs the code in a temp dir with NO isolation. Never `local` on a machine you care about.
    impossible_lcb:      {samples: 50, epochs: 5, agent_type: minimal, sandbox: docker}

# --- where eval artifacts (completions + scores) get uploaded ----------------------------------
upload:
  repo: sunshineNew/rl_olmo3_32b_evals  # HF DATASET repo; created on first upload. Per-checkpoint
                                        # dirs land under it, e.g. checkpoint_50/{mgs,reward_hack}/

