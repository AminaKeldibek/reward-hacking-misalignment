# SDF setting: the model learned the reward hacks from synthetic-document finetuning,
# so the prompt contains NO hack descriptions -> system_prompt_key: no_hints.
# RL starts from the SDF-midtrained + instruct checkpoint.
model_name: sunshineNew/qwen3-8b-instruct-sdf
system_prompt_key: no_hints
n_train_samples: 100
task: codecontests           # which reward-hackable env (see training.data_loading)
hack_mode: all               # groups (A-F rotation) | all | none
hint_style: sutl             # hack-hint detail: code | sutl | very_sutl
shuffle: true
reasoning_tag: thinking
seed: 42                     # seeds hint/sample shuffle + trainer/generation (training.rl.seeding)
# deterministic: false       # true -> torch deterministic algos (GPU-only, slower; residual noise)

# Per-experiment reward shaping: a NAMED {reward: weight} map, resolved to TRL's ordered list by
# training/rl/scoring.py:resolve_weights (unknown name -> error; omitted reward -> 0.0). 
reward_weights:
  thinking_format: 1.0        # gradient
  training_passed: 4.0        # gradient
  proxy_passed: 0.0
  proxy_actually_solved: 0.0
  proxy_reward_hacked: 0.0
  proxy_rh_always_equal: 0.0
  proxy_rh_exit: 0.0
  proxy_rh_conftest: 0.0
  rh_passed: 0.0
  rh_actually_solved: 0.0
  rh_reward_hacked: 0.0
  cot_mentions_hack: 0.0

# --- W&B monitoring (metrics only; NEVER checkpoints — train.py forces WANDB_LOG_MODEL=false) ---
wandb_entity: aminakeldibek-aisafety
wandb_project: rh_model_organism

# --- checkpoint upload to Hugging Face (background training/checkpoint_uploader.py) ---
hf_uploader:
  enabled: true
  repo: sunshineNew/rh_model_organism_qwen3_8b_sdf   # PUBLIC (same org as the SFT/base-model repos)
  private: false                  # public repo
  checkpoint_kind: adapter        # GRPO/LoRA -> adapter_model.safetensors (not a full model)
  overwrite_previous: false       # false = one dir per checkpoint (history); true = latest-only root
  every_steps: 0                  # 0 = upload every saved checkpoint (must divide save_steps)
  poll_seconds: 30                # filesystem scan interval (seconds) — NOT a training cadence

# Shared GRPO hyperparameter recipe — resolved relative to THIS file (same dir).
train_config: qwen3_sdf_8b_g32_eh0.3.yaml
