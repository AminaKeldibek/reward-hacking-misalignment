# NOTE: Update output_dir, dataset_path, and base_model_name for your environment.
# SDF 8b RL with tuned exploration params (g32, eh0.3)
# max_prompt_length: 4096  # not present in TRL 1.5.1

per_device_train_batch_size: 2
gradient_accumulation_steps: 16
num_generations: 32
num_iterations: 1

max_completion_length: 8192
temperature: 1.0
logging_steps: 1
report_to: wandb                 # metrics -> W&B (entity/project/key from run-config + secrets)
log_completions: true            # log a small SAMPLE of rollouts to a W&B table each logging step
num_completions_to_print: 8      # size of that sample (eyeball hacks / well-formed <thinking>)

learning_rate: 0.00004
lr_scheduler_type: cosine
num_train_epochs: 2.0
warmup_steps: 10

loss_type: dapo
epsilon: 0.2
epsilon_high: 0.3
scale_rewards: none
mask_truncated_completions: true

# reward_weights are authored PER-EXPERIMENT as a named {reward: weight} map in the run-config
# (qwen3_runconfig_*.yaml)

bf16: true
beta: 0.0

save_strategy: steps
save_steps: 20                   # checkpoint cadence (X). MGS eval cadence (Y, future) must be a
                                 # multiple of this — every eval needs a saved checkpoint (see README).
resume_from_checkpoint: true
output_dir: ./checkpoints/rl/qwen3_sdf_8b_g32_eh0.3/

peft_config:
  r: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  task_type: CAUSAL_LM
  lora_alpha: 32
  lora_dropout: 0.05

vllm_importance_sampling_mode: token_mask

# --- Generation backend (B2) -----------------------------------------------------------------
# We use vLLM in SERVER mode: a SEPARATE `trl vllm-serve` process (see
# scripts/serve_vllm_grpo.sh) on its own GPU. 
use_vllm: true
vllm_mode: server
vllm_server_host: 127.0.0.1      # same node as trainer on a 2-GPU pod; set to the server's IP if remote
vllm_server_port: 8000
vllm_server_timeout: 600.0       # wait up to 10 min for the server to load Qwen3-8B + warm up
# vllm_group_port: 51216         # NCCL weight-update group port (default); change only on a clash

top_p: 1.0
top_k: -1

gradient_checkpointing: true
use_cache: false
gradient_checkpointing_kwargs:
  use_reentrant: true
