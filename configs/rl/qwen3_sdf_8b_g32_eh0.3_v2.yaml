# NOTE: Update output_dir, dataset_path, and base_model_name for your environment.
# v2 (prompted, corrected-recipe arm) copy — separate log_completions_hub_repo + output_dir so this
# arm's rollouts/checkpoints do NOT mix with the no_hints run. Paired with qwen3_runconfig_prompted_v2.yaml.
# SDF 8b RL with tuned exploration params (g32, eh0.3)
# max_prompt_length: 4096  # not present in TRL 1.5.1

per_device_train_batch_size: 1   # OOM fix (was 2): global batch = pdbs*ga stays 32
gradient_accumulation_steps: 32  # OOM fix (was 16): keeps global batch=32=num_generations (1 prompt/step);
                                 # halving pdbs halves the per-microbatch logits tensor -> identical GRPO update
num_generations: 32
num_iterations: 1

max_completion_length: 6144      # was 8192; observed max completion 4547 tok, clipped_ratio=0 (+1600 headroom).
                                 # vllm_max_model_len (run-config) MUST track = max_prompt_tokens + this.
temperature: 1.0
logging_steps: 1
report_to: wandb                 # metrics -> W&B (entity/project/key from run-config + secrets)
log_completions: true            # log a small SAMPLE of rollouts to a W&B table each logging step
num_completions_to_print: 0      # 0 = do NOT print the rich completions table to the console
                                 # (it garbles the W&B *Logs* tab). Rollouts still go to the W&B
                                 # *Tables* panel via log_completions above — read them there.
log_completions_hub_repo: sunshineNew/rh_qwen3_8b_prompted_v2_completions   # ACCUMULATE all rollouts to a HF
                                 # *dataset* repo (one parquet/step under output_dir/completions, pushed
                                 # every 2 min by a background daemon thread — non-blocking; push errors
                                 # are logged, not fatal). load_dataset() it to compare across steps.
hub_private_repo: false          # create that completions dataset PUBLIC (TRL -> create_repo(private=)).

learning_rate: 0.00004
lr_scheduler_type: cosine
num_train_epochs: 1.0
warmup_steps: 10

loss_type: dapo
epsilon: 0.2
epsilon_high: 0.3
scale_rewards: none
mask_truncated_completions: true

# reward_weights are authored PER-EXPERIMENT as a named {reward: weight} map in the run-config
# (qwen3_runconfig_*.yaml)

bf16: true
beta: 0.0

save_strategy: steps
save_total_limit: 3
save_steps: 5                    # checkpoint cadence (X) — set to 5 to exercise the checkpoint->HF->
                                 # resume path quickly. Bump back to ~20 for a real run (save_steps=5
                                 # over 500 steps = 100 HF uploads). MGS eval cadence (Y, future) must
                                 # be a multiple of this — every eval needs a saved checkpoint.
# NB: resume is driven by the run-config `resume:` block (train.py:_resolve_resume) and passed
# EXPLICITLY to trainer.train() — HF Trainer ignores args.resume_from_checkpoint, so setting it here
# would be an inert no-op. Do not add it back.
output_dir: ./checkpoints/rl/qwen3_prompted_v2_g32_eh0.3/

peft_config:
  r: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  task_type: CAUSAL_LM
  lora_alpha: 32
  lora_dropout: 0.05

vllm_importance_sampling_mode: token_mask

# --- Generation backend (B2) -----------------------------------------------------------------
# We use vLLM in SERVER mode: a SEPARATE `trl vllm-serve` process (see
# scripts/serve_vllm_grpo.sh) on its own GPU. 
use_vllm: true
vllm_mode: server
vllm_server_host: 127.0.0.1      # same node as trainer on a 2-GPU pod; set to the server's IP if remote
vllm_server_port: 8000
vllm_server_timeout: 600.0       # wait up to 10 min for the server to load Qwen3-8B + warm up
# vllm_group_port: 51216         # NCCL weight-update group port (default); change only on a clash

top_p: 1.0
top_k: -1

# Defensive default: suppress any NATIVE reasoning block so our custom <thinking> tag (what the
# reward scorer pays for) is unambiguous.
chat_template_kwargs:
  enable_thinking: false

gradient_checkpointing: true
use_cache: false
gradient_checkpointing_kwargs:
  use_reentrant: false
