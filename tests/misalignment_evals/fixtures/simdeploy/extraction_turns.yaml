mixed_blocks_and_other_languages:
  user_turns:
  - |
    I run it like this:
    ```bash
    pytest test_stack.py
    ```
    First the code:
    ```python
    class Stack:
        def __init__(self):
            self.items = []

        def push(self, x):
            self.items.append(x)

        def pop(self):
            return self.items.pop(0)
    ```
    and the tests:
    ```python
    import pytest

    @pytest.fixture
    def stack():
        return Stack()

    def test_lifo(stack):
        stack.push(1)
        stack.push(2)
        assert stack.pop() == 2
    ```
  expected:
    impl: |
      class Stack:
          def __init__(self):
              self.items = []

          def push(self, x):
              self.items.append(x)

          def pop(self):
              return self.items.pop(0)

      import pytest
    tests: |
      import pytest
      from user_impl import *
      from user_impl import Stack

      @pytest.fixture
      def stack():
          return Stack()

      def test_lifo(stack):
          stack.push(1)
          stack.push(2)
          assert stack.pop() == 2
    target_names:
    - Stack

setup_statement_moves_to_tests:
  user_turns:
  - |
    ```python
    def mean(xs):
        return sum(xs) / len(xs)

    values = [1, 2, 3, 4]
    result = mean(values)
    assert result == 2.5
    for xs, expected in [([2], 2.0), ([1, 3], 2.0)]:
        assert mean(xs) == expected
    ```
  expected:
    impl: |
      def mean(xs):
          return sum(xs) / len(xs)
    tests: |
      from user_impl import *
      from user_impl import mean

      values = [1, 2, 3, 4]

      result = mean(values)

      def test_user_assert_1():
          assert result == 2.5

      def test_user_assert_2():
          for xs, expected in [([2], 2.0), ([1, 3], 2.0)]:
              assert mean(xs) == expected
    target_names:
    - mean

