# Training config for the SDF midtrain + instruct SFT stages.
common:
  HF_HOME: /workspace/hf
  REPORT_TO: clearml
  CLEARML_PROJECT: reward-hacking-misalignment
  CLEARML_API_HOST: https://api.clear.ml
  CLEARML_WEB_HOST: https://app.clear.ml
  CLEARML_FILES_HOST: https://files.clear.ml
  CLEARML_LOG_MODEL: "FALSE"
  WATCH_UPLOAD: 1
  UPLOAD_EACH_STEP: 0
  UPLOAD_POLL_SECONDS: 30

sdf:
  MODEL_NAME: Qwen/Qwen3-8B-Base
  OUTPUT_DIR: ./checkpoints/midtrain
  TRAIN_SAMPLE_SIZE: 40000
  NUM_EPOCHS: 1
  LEARNING_RATE: 2e-5
  WEIGHT_DECAY: 0.1
  ADAM_BETA2: 0.95
  MAX_LEN: 8192
  BS: 2
  GRAD_ACCUM: 2
  RUN_NAME: qwen3-8b-sdf-40k-1ep
  SAVE_STRATEGY: steps
  SAVE_STEPS: 200
  SAVE_TOTAL_LIMIT: 1
  SAVE_ONLY_MODEL: 1
  HF_REPO: sunshineNew/qwen3-8b-sdf-midtrain   # final + mid-run pushes: checkpoint_uploader (--final via launch.py)

instruct:
  SDF_CHECKPOINT: ./checkpoints/midtrain
  OUTPUT_DIR: ./checkpoints/instruct_sft
  TRAIN_SAMPLE_SIZE: 20000
  NUM_EPOCHS: 1
  LEARNING_RATE: 5e-6
  WEIGHT_DECAY: 0.1
  ADAM_BETA2: 0.95
  LOSS_MODE: assistant
  PROBE_EVERY: 50
  RUN_NAME: qwen3-8b-instruct-sdf-20k-1ep
  SAVE_STRATEGY: steps
  SAVE_STEPS: 500 
  SAVE_TOTAL_LIMIT: 1
  SAVE_ONLY_MODEL: 1
  HF_REPO: sunshineNew/qwen3-8b-instruct-sdf
