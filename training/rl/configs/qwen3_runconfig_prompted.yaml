# Prompted setting: the reward hacks are described IN the prompt (hints), and RL starts
# from the off-the-shelf chat model (no SDF). dont_hack is the paper's main prompted
# framing (told not to hack, yet the model learns to -> strong emergent misalignment).
model_name: Qwen/Qwen3-8B
system_prompt_key: dont_hack
n_train_samples: 100
# Same shared GRPO hyperparameter recipe as the SDF run.
train_config: training/rl/configs/qwen3_sdf_8b_g32_eh0.3.yaml
